name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: self-hosted
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const { version } = JSON.parse(readFileSync("package.json", "utf8")); if (process.env.RELEASE_REF_TYPE !== "tag") { throw new Error("Run this workflow on a version tag, not a branch."); } if (process.env.RELEASE_TAG !== version && process.env.RELEASE_TAG !== `v${version}`) { throw new Error(`Tag ${process.env.RELEASE_TAG} must match package version ${version}`); }'

      - name: Run tests and build
        run: npm test

      # Configure this repository and publish.yml as a trusted publisher on npm.
      - name: Publish package
        env:
          NPM_DIST_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
        run: npm publish --access public --tag "$NPM_DIST_TAG"
