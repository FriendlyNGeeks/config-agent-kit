name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Check out commit
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run tests and build
        run: npm test

  publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    # npm trusted publishing and provenance require a GitHub-hosted runner.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out commit
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Check npm version
        id: package
        run: node .github/scripts/check-npm-version.mjs

      # Configure this repository and publish.yml as a trusted publisher on npm.
      - name: Publish package
        if: steps.package.outputs.publish == 'true'
        env:
          NPM_DIST_TAG: ${{ steps.package.outputs.tag }}
        run: node .github/scripts/publish-npm.mjs
